<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica con Gráficas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            height: 90vh;
        }

        .calculadora-panel, .grafica-panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .calculadora-panel {
            overflow-y: auto;
        }

        .grafica-panel {
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: #666;
            margin-top: 5px;
        }

        .display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 60px;
            font-size: 24px;
            text-align: right;
            word-wrap: break-word;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .operacion-actual {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .boton {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .boton:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .boton:active {
            transform: translateY(0);
        }

        .suma { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .resta { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .multiplicar { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .dividir { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .limpiar { background: linear-gradient(135deg, #a8a8a8 0%, #7f7f7f 100%); }

        .seccion {
            margin-top: 20px;
        }

        .seccion-titulo {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .botones-avanzados {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .boton-avanzado {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .boton-avanzado:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .modulo { background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%); }
        .potencia { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .raiz { background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%); }
        .raiz-n { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
        .logaritmo { background: linear-gradient(135deg, #0ba360 0%, #3cba92 100%); }
        .ln { background: linear-gradient(135deg, #48c6ef 0%, #6f86d6 100%); }
        .log-custom { background: linear-gradient(135deg, #f857a6 0%, #ff5858 100%); }
        .seno { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .coseno { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .tangente { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .arcoseno { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); }
        .arcocoseno { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
        .arcotangente { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .factorial { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
        .absoluto { background: linear-gradient(135deg, #fdcbf1 0%, #e6dee9 100%); }
        .redondeo { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
        .pi { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); }
        .euler { background: linear-gradient(135deg, #868f96 0%, #596164 100%); }

        .grafica-header {
            margin-bottom: 20px;
        }

        .grafica-header h2 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .input-funcion {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-funcion input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-funcion input:focus {
            outline: none;
            border-color: #667eea;
        }

        .boton-graficar {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .boton-graficar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

        .ejemplos {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }

        .ejemplos span {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 5px;
            margin: 2px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .ejemplos span:hover {
            background: #667eea;
            color: white;
        }

        .historial {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            max-height: 150px;
            overflow-y: auto;
        }

        .historial-titulo {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .historial-item {
            font-size: 13px;
            color: #333;
            padding: 5px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .historial-item:hover {
            background: white;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .grafica-panel {
                min-height: 500px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Panel Calculadora -->
        <div class="calculadora-panel">
            <div class="header">
                <h1>🧮 Calculadora</h1>
                <p>Simple y elegante</p>
            </div>

            <div class="display">
                <div class="operacion-actual" id="operacionActual"></div>
                <div id="display">0</div>
            </div>

            <div class="botones">
                <button class="boton suma" onclick="setOperacion('suma')">+ Suma</button>
                <button class="boton resta" onclick="setOperacion('resta')">- Resta</button>
                <button class="boton multiplicar" onclick="setOperacion('multiplicar')">× Multiplicar</button>
                <button class="boton dividir" onclick="setOperacion('dividir')">/ Dividir</button>
            </div>

            <button class="boton limpiar" onclick="limpiar()" style="width: 100%;">Limpiar</button>

            <div class="seccion">
                <div class="seccion-titulo">⚡ OPERACIONES AVANZADAS:</div>
                <div class="botones-avanzados">
                    <button class="boton-avanzado modulo" onclick="setOperacion('modulo')">5. Módulo (resto)</button>
                    <button class="boton-avanzado potencia" onclick="setOperacion('potencia')">6. Potencia (a^b)</button>
                    <button class="boton-avanzado raiz" onclick="operacionUnaria('raiz')">7. Raíz cuadrada</button>
                    <button class="boton-avanzado raiz-n" onclick="operacionUnaria('raizN')">8. Raíz n-ésima</button>
                    <button class="boton-avanzado logaritmo" onclick="operacionUnaria('log10')">9. Logaritmo (base 10)</button>
                    <button class="boton-avanzado ln" onclick="operacionUnaria('ln')">10. Logaritmo natural (ln)</button>
                    <button class="boton-avanzado log-custom" onclick="setOperacion('logCustom')">11. Log (base personalizada)</button>
                </div>
            </div>

            <div class="seccion">
                <div class="seccion-titulo">📐 FUNCIONES TRIGONOMÉTRICAS:</div>
                <div class="botones-avanzados">
                    <button class="boton-avanzado seno" onclick="operacionUnaria('seno')">12. Seno</button>
                    <button class="boton-avanzado coseno" onclick="operacionUnaria('coseno')">13. Coseno</button>
                    <button class="boton-avanzado tangente" onclick="operacionUnaria('tangente')">14. Tangente</button>
                    <button class="boton-avanzado arcoseno" onclick="operacionUnaria('arcoseno')">15. Arcoseno</button>
                    <button class="boton-avanzado arcocoseno" onclick="operacionUnaria('arcocoseno')">16. Arcocoseno</button>
                    <button class="boton-avanzado arcotangente" onclick="operacionUnaria('arcotangente')">17. Arcotangente</button>
                </div>
            </div>

            <div class="seccion">
                <div class="seccion-titulo">🎯 OTRAS FUNCIONES:</div>
                <div class="botones-avanzados">
                    <button class="boton-avanzado factorial" onclick="operacionUnaria('factorial')">18. Factorial</button>
                    <button class="boton-avanzado absoluto" onclick="operacionUnaria('absoluto')">19. Valor absoluto</button>
                    <button class="boton-avanzado redondeo" onclick="operacionUnaria('redondeo')">20. Redondeo</button>
                </div>
            </div>

            <div class="seccion">
                <div class="seccion-titulo">⭐ CONSTANTES:</div>
                <div class="botones-avanzados">
                    <button class="boton-avanzado pi" onclick="insertarConstante('pi')">21. Mostrar π (pi)</button>
                    <button class="boton-avanzado euler" onclick="insertarConstante('e')">22. Mostrar e (Euler)</button>
                </div>
            </div>

            <div class="historial">
                <div class="historial-titulo">📝 Historial</div>
                <div id="historial"></div>
            </div>

            <div class="footer">
                📱 ❤️ Hecho con amor por Pepe Gamboa<br>
                Créditos: @losmonosco
            </div>
        </div>

        <!-- Panel Gráficas -->
        <div class="grafica-panel">
            <div class="grafica-header">
                <h2>📊 Visualización Gráfica</h2>
                <div class="input-funcion">
                    <input type="text" id="funcionInput" placeholder="Escribe tu función, ej: sin(x), x^2, log(x)" />
                    <button class="boton-graficar" onclick="graficarFuncion()">Graficar</button>
                </div>
                <div class="ejemplos">
                    <strong>Ejemplos:</strong>
                    <span onclick="graficarEjemplo('sin(x)')">sin(x)</span>
                    <span onclick="graficarEjemplo('cos(x)')">cos(x)</span>
                    <span onclick="graficarEjemplo('x^2')">x²</span>
                    <span onclick="graficarEjemplo('x^3 - 2*x')">x³-2x</span>
                    <span onclick="graficarEjemplo('log(x)')">log(x)</span>
                    <span onclick="graficarEjemplo('sqrt(x)')">√x</span>
                    <span onclick="graficarEjemplo('abs(x)')">|x|</span>
                    <span onclick="graficarEjemplo('exp(x)')">eˣ</span>
                </div>
            </div>
            <div class="canvas-container">
                <canvas id="grafica"></canvas>
            </div>
        </div>
    </div>

    <script>
        let valorActual = '0';
        let operacion = null;
        let primerNumero = null;
        let historialArray = [];
        let chart = null;

        function actualizarDisplay() {
            document.getElementById('display').textContent = valorActual;
            if (operacion && primerNumero !== null) {
                let simbolo = {
                    'suma': '+',
                    'resta': '-',
                    'multiplicar': '×',
                    'dividir': '÷',
                    'potencia': '^',
                    'modulo': 'mod',
                    'logCustom': 'log'
                }[operacion] || '';
                document.getElementById('operacionActual').textContent = 
                    `${primerNumero} ${simbolo}`;
            } else {
                document.getElementById('operacionActual').textContent = '';
            }
        }

        function setOperacion(op) {
            if (valorActual === '0' || valorActual === '') {
                alert('Por favor ingresa un número primero');
                return;
            }
            primerNumero = parseFloat(valorActual);
            operacion = op;
            valorActual = '0';
            actualizarDisplay();
            
            let segundo = prompt('Ingresa el segundo número:');
            if (segundo !== null && segundo !== '') {
                valorActual = segundo;
                calcular();
            }
        }

        function calcular() {
            if (primerNumero === null || operacion === null) return;
            
            let segundoNumero = parseFloat(valorActual);
            let resultado;
            let operacionTexto = '';

            try {
                switch(operacion) {
                    case 'suma':
                        resultado = primerNumero + segundoNumero;
                        operacionTexto = `${primerNumero} + ${segundoNumero}`;
                        break;
                    case 'resta':
                        resultado = primerNumero - segundoNumero;
                        operacionTexto = `${primerNumero} - ${segundoNumero}`;
                        break;
                    case 'multiplicar':
                        resultado = primerNumero * segundoNumero;
                        operacionTexto = `${primerNumero} × ${segundoNumero}`;
                        break;
                    case 'dividir':
                        if (segundoNumero === 0) throw new Error('No se puede dividir por cero');
                        resultado = primerNumero / segundoNumero;
                        operacionTexto = `${primerNumero} ÷ ${segundoNumero}`;
                        break;
                    case 'potencia':
                        resultado = Math.pow(primerNumero, segundoNumero);
                        operacionTexto = `${primerNumero}^${segundoNumero}`;
                        break;
                    case 'modulo':
                        resultado = primerNumero % segundoNumero;
                        operacionTexto = `${primerNumero} mod ${segundoNumero}`;
                        break;
                    case 'logCustom':
                        resultado = Math.log(primerNumero) / Math.log(segundoNumero);
                        operacionTexto = `log${segundoNumero}(${primerNumero})`;
                        break;
                }

                valorActual = resultado.toString();
                agregarHistorial(`${operacionTexto} = ${resultado}`);
                actualizarDisplay();
                
                primerNumero = null;
                operacion = null;
            } catch(error) {
                alert(error.message);
                limpiar();
            }
        }

        function operacionUnaria(tipo) {
            let numero = prompt('Ingresa el número:');
            if (numero === null || numero === '') return;
            
            numero = parseFloat(numero);
            let resultado;
            let operacionTexto = '';

            try {
                switch(tipo) {
                    case 'raiz':
                        if (numero < 0) throw new Error('No se puede calcular raíz de número negativo');
                        resultado = Math.sqrt(numero);
                        operacionTexto = `√${numero}`;
                        break;
                    case 'raizN':
                        let n = prompt('¿Raíz de qué grado?');
                        if (n === null || n === '') return;
                        n = parseFloat(n);
                        resultado = Math.pow(numero, 1/n);
                        operacionTexto = `${n}√${numero}`;
                        break;
                    case 'log10':
                        if (numero <= 0) throw new Error('Logaritmo solo para números positivos');
                        resultado = Math.log10(numero);
                        operacionTexto = `log(${numero})`;
                        break;
                    case 'ln':
                        if (numero <= 0) throw new Error('Logaritmo solo para números positivos');
                        resultado = Math.log(numero);
                        operacionTexto = `ln(${numero})`;
                        break;
                    case 'seno':
                        resultado = Math.sin(numero);
                        operacionTexto = `sin(${numero})`;
                        break;
                    case 'coseno':
                        resultado = Math.cos(numero);
                        operacionTexto = `cos(${numero})`;
                        break;
                    case 'tangente':
                        resultado = Math.tan(numero);
                        operacionTexto = `tan(${numero})`;
                        break;
                    case 'arcoseno':
                        if (numero < -1 || numero > 1) throw new Error('Arcoseno requiere valor entre -1 y 1');
                        resultado = Math.asin(numero);
                        operacionTexto = `arcsin(${numero})`;
                        break;
                    case 'arcocoseno':
                        if (numero < -1 || numero > 1) throw new Error('Arcocoseno requiere valor entre -1 y 1');
                        resultado = Math.acos(numero);
                        operacionTexto = `arccos(${numero})`;
                        break;
                    case 'arcotangente':
                        resultado = Math.atan(numero);
                        operacionTexto = `arctan(${numero})`;
                        break;
                    case 'factorial':
                        if (numero < 0 || numero % 1 !== 0) throw new Error('Factorial solo para enteros positivos');
                        resultado = factorial(numero);
                        operacionTexto = `${numero}!`;
                        break;
                    case 'absoluto':
                        resultado = Math.abs(numero);
                        operacionTexto = `|${numero}|`;
                        break;
                    case 'redondeo':
                        resultado = Math.round(numero);
                        operacionTexto = `round(${numero})`;
                        break;
                }

                valorActual = resultado.toString();
                agregarHistorial(`${operacionTexto} = ${resultado}`);
                actualizarDisplay();
            } catch(error) {
                alert(error.message);
            }
        }

        function factorial(n) {
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        function insertarConstante(tipo) {
            if (tipo === 'pi') {
                valorActual = Math.PI.toString();
                agregarHistorial(`π = ${Math.PI}`);
            } else if (tipo === 'e') {
                valorActual = Math.E.toString();
                agregarHistorial(`e = ${Math.E}`);
            }
            actualizarDisplay();
        }

        function limpiar() {
            valorActual = '0';
            operacion = null;
            primerNumero = null;
            actualizarDisplay();
        }

        function agregarHistorial(texto) {
            historialArray.unshift(texto);
            if (historialArray.length > 10) historialArray.pop();
            
            let historialDiv = document.getElementById('historial');
            historialDiv.innerHTML = historialArray.map(item => 
                `<div class="historial-item">${item}</div>`
            ).join('');
        }

        // FUNCIONES DE GRÁFICAS
        function inicializarGrafica() {
            const ctx = document.getElementById('grafica').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'f(x)',
                        data: [],
                        borderColor: 'rgb(102, 126, 234)',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        borderWidth: 3,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                font: { size: 14 }
                            }
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'x',
                                font: { size: 16 }
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.1)'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'f(x)',
                                font: { size: 16 }
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.1)'
                            }
                        }
                    }
                }
            });
        }

        function graficarFuncion() {
            let funcion = document.getElementById('funcionInput').value;
            if (!funcion) {
                alert('Por favor escribe una función');
                return;
            }

            try {
                // Convertir la función a sintaxis de Math.js
                funcion = funcion.replace(/\^/g, '^');
                funcion = funcion.replace(/log/g, 'log10');
                
                const xValues = [];
                const yValues = [];
                const paso = 0.1;
                const rango = 20;

                for (let x = -rango; x <= rango; x += paso) {
                    try {
                        const y = math.evaluate(funcion, { x: x });
                        if (isFinite(y) && !isNaN(y)) {
                            xValues.push(x.toFixed(2));
                            yValues.push(y);
                        }
                    } catch(e) {
                        continue;
                    }
                }

                if (xValues.length === 0) {
                    throw new Error('No se pudieron generar puntos válidos');
                }

                chart.data.labels = xValues;
                chart.data.datasets[0].data = yValues;
                chart.data.datasets[0].label = `f(x) = ${document.getElementById('funcionInput').value}`;
                chart.update();
                
                agregarHistorial(`Graficada: ${document.getElementById('funcionInput').value}`);
            } catch(error) {
                alert('Error al graficar: ' + error.message + '\n\nVerifica la sintaxis de tu función');
            }
        }

        function graficarEjemplo(funcion) {
            document.getElementById('funcionInput').value = funcion;
            graficarFuncion();
        }

        // Inicializar
        actualizarDisplay();
        inicializarGrafica();
        graficarEjemplo('sin(x)');
    </script>
</body>
</html>
