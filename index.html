<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Científica Multilenguaje</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    /* === Estilos generales === */
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center;transition:all 0.3s;}
    :root{
      --bg: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      --panel-bg: #fff;
      --text:#333;
    }
    body.dark{
      --bg: linear-gradient(135deg,#1f1f1f 0%,#333 100%);
      --panel-bg:#2a2a2a;
      --text:#eee;
    }
    .container{display:grid;grid-template-columns:450px 1fr;gap:20px;max-width:1400px;width:100%;height:90vh;}
    .calculadora-panel,.grafica-panel{background:var(--panel-bg);border-radius:20px;padding:30px;
      box-shadow:0 20px 60px rgba(0,0,0,0.3);transition:all 0.3s;}
    .calculadora-panel{overflow-y:auto;}
    .grafica-panel{display:flex;flex-direction:column;}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
    .header h1{color:#667eea;font-size:1.6em;}
    .controls{display:flex;gap:10px;}
    .selector,.modo{padding:6px 10px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;}
    body.dark .selector, body.dark .modo{background:#444;color:#eee;border-color:#666;}
    .display{background:linear-gradient(145deg,#667eea 0%,#764ba2 100%);color:white;padding:20px;border-radius:20px;
      margin-bottom:20px;min-height:80px;font-size:24px;text-align:right;position:relative;overflow:hidden;}
    .operacion-actual{font-size:14px;opacity:0.8;margin-bottom:5px;}
    .input-numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px;}
    .btn-numero,.boton{padding:18px;border:none;border-radius:18px;font-weight:700;cursor:pointer;transition:all 0.2s;}
    .btn-numero{font-size:20px;background:#e8ecf1;box-shadow:0 6px 15px rgba(0,0,0,0.2);}
    .btn-borrar{background:linear-gradient(145deg,#ff7675,#d63031);color:white;}
    .botones{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px;}
    .boton{font-size:17px;color:white;}
    .suma{background:linear-gradient(145deg,#11998e,#38ef7d);}
    .resta{background:linear-gradient(145deg,#f093fb,#f5576c);}
    .multiplicar{background:linear-gradient(145deg,#4facfe,#00f2fe);}
    .dividir{background:linear-gradient(145deg,#fa709a,#fee140);}
    .calcular{background:linear-gradient(145deg,#00c6ff,#0072ff);font-size:19px;width:100%;margin-bottom:10px;}
    .limpiar{background:linear-gradient(145deg,#a8a8a8,#7f7f7f);width:100%;}
    .historial{margin-top:15px;padding:15px;background:#f8f9fa;border-radius:10px;max-height:150px;overflow-y:auto;}
    body.dark .historial{background:#444;}
    .historial-titulo{font-size:12px;color:#667eea;font-weight:600;margin-bottom:8px;}
    .historial-item{font-size:13px;padding:5px;border-bottom:1px solid #e0e0e0;}
    body.dark .historial-item{border-color:#666;}
    .grafica-header{margin-bottom:20px;}
    .grafica-header h2{color:#667eea;font-size:1.5em;margin-bottom:10px;}
    .input-funcion{display:flex;gap:10px;margin-bottom:15px;}
    .input-funcion input{flex:1;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;}
    body.dark .input-funcion input{background:#333;border-color:#666;color:#eee;}
    .boton-graficar{padding:12px 25px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:10px;font-weight:600;}
    .canvas-container{flex:1;background:#f8f9fa;border-radius:15px;padding:20px;}
    body.dark .canvas-container{background:#333;}
    .footer{text-align:center;margin-top:20px;font-size:12px;color:#666;}
    body.dark .footer{color:#aaa;}
    @media(max-width:1200px){.container{grid-template-columns:1fr;height:auto;}.grafica-panel{min-height:500px;}}
  </style>
</head>
<body>
  <div class="container">
    <!-- Panel calculadora -->
    <div class="calculadora-panel">
      <div class="header">
        <h1 id="title">🧮 Calculadora</h1>
        <div class="controls">
          <select id="lang" class="selector" onchange="cambiarIdioma(this.value)">
            <option value="es">ESP</option>
            <option value="en">ENG</option>
            <option value="fr">FRA</option>
            <option value="de">GER</option>
          </select>
          <button class="modo" onclick="toggleModo()">🌙/☀️</button>
        </div>
      </div>

      <div class="display"><div class="operacion-actual" id="operacionActual"></div><div id="display">0</div></div>

      <!-- Botones numéricos -->
      <div class="input-numeros">
        <button class="btn-numero" onclick="agregarDigito('7')">7</button>
        <button class="btn-numero" onclick="agregarDigito('8')">8</button>
        <button class="btn-numero" onclick="agregarDigito('9')">9</button>
        <button class="btn-numero" onclick="agregarDigito('4')">4</button>
        <button class="btn-numero" onclick="agregarDigito('5')">5</button>
        <button class="btn-numero" onclick="agregarDigito('6')">6</button>
        <button class="btn-numero" onclick="agregarDigito('1')">1</button>
        <button class="btn-numero" onclick="agregarDigito('2')">2</button>
        <button class="btn-numero" onclick="agregarDigito('3')">3</button>
        <button class="btn-numero" onclick="agregarDigito('0')">0</button>
        <button class="btn-numero" onclick="agregarDigito('.')">.</button>
        <button class="btn-numero btn-borrar" onclick="borrarDigito()">⌫</button>
      </div>

      <!-- Operaciones -->
      <div class="botones">
        <button class="boton suma" onclick="setOperacion('suma')" id="btnSuma">+ Suma</button>
        <button class="boton resta" onclick="setOperacion('resta')" id="btnResta">- Resta</button>
        <button class="boton multiplicar" onclick="setOperacion('multiplicar')" id="btnMulti">× Multiplicar</button>
        <button class="boton dividir" onclick="setOperacion('dividir')" id="btnDiv">÷ Dividir</button>
      </div>
      <button class="boton calcular" onclick="calcular()" id="btnCalc">✓ Calcular / Enter</button>
      <button class="boton limpiar" onclick="limpiar()" id="btnClear">Limpiar Todo</button>

      <div class="historial">
        <div class="historial-titulo" id="historyTitle">📝 Historial</div>
        <div id="historial"></div>
      </div>
      <div class="footer" id="footer">📱 ❤️ Hecho con amor por Pepe Gamboa</div>
    </div>

    <!-- Panel gráfica -->
    <div class="grafica-panel">
      <div class="grafica-header">
        <h2 id="graphTitle">📊 Visualización Gráfica</h2>
        <div class="input-funcion">
          <input type="text" id="funcionInput" placeholder="Ej: sin(x), x^2, log(x)">
          <button class="boton-graficar" onclick="graficarFuncion()" id="btnGraph">Graficar</button>
        </div>
      </div>
      <div class="canvas-container"><canvas id="grafica"></canvas></div>
    </div>
  </div>

<script>
/* === Variables y estado === */
let valorActual='0', operacion=null, primerNumero=null, historialArray=[], chart=null, nuevoNumero=true;

/* === Multilenguaje === */
const textos={
  es:{title:"🧮 Calculadora",btnSuma:"+ Suma",btnResta:"- Resta",btnMulti:"× Multiplicar",btnDiv:"÷ Dividir",
      btnCalc:"✓ Calcular / Enter",btnClear:"Limpiar Todo",historyTitle:"📝 Historial",footer:"📱 ❤️ Hecho con amor por Pepe Gamboa",
      graphTitle:"📊 Visualización Gráfica",btnGraph:"Graficar"},
  en:{title:"🧮 Calculator",btnSuma:"+ Add",btnResta:"- Subtract",btnMulti:"× Multiply",btnDiv:"÷ Divide",
      btnCalc:"✓ Calculate / Enter",btnClear:"Clear All",historyTitle:"📝 History",footer:"📱 ❤️ Made with love by Pepe Gamboa",
      graphTitle:"📊 Graph Visualization",btnGraph:"Plot"},
  fr:{title:"🧮 Calculatrice",btnSuma:"+ Addition",btnResta:"- Soustraction",btnMulti:"× Multiplication",btnDiv:"÷ Division",
      btnCalc:"✓ Calculer / Entrée",btnClear:"Effacer Tout",historyTitle:"📝 Historique",footer:"📱 ❤️ Fait avec amour par Pepe Gamboa",
      graphTitle:"📊 Visualisation Graphique",btnGraph:"Tracer"},
  de:{title:"🧮 Rechner",btnSuma:"+ Addieren",btnResta:"- Subtrahieren",btnMulti:"× Multiplizieren",btnDiv:"÷ Dividieren",
      btnCalc:"✓ Berechnen / Eingabe",btnClear:"Alles Löschen",historyTitle:"📝 Verlauf",footer:"📱 ❤️ Mit Liebe gemacht von Pepe Gamboa",
      graphTitle:"📊 Grafische Darstellung",btnGraph:"Zeichnen"}
};
function cambiarIdioma(lang){
  const t=textos[lang];
  document.getElementById('title').textContent=t.title;
  document.getElementById('btnSuma').textContent=t.btnSuma;
  document.getElementById('btnResta').textContent=t.btnResta;
  document.getElementById('btnMulti').textContent=t.btnMulti;
  document.getElementById('btnDiv').textContent=t.btnDiv;
  document.getElementById('btnCalc').textContent=t.btnCalc;
  document.getElementById('btnClear').textContent=t.btnClear;
  document.getElementById('historyTitle').textContent=t.historyTitle;
  document.getElementById('footer').textContent=t.footer;
  document.getElementById('graphTitle').textContent=t.graphTitle;
  document.getElementById('btnGraph').textContent=t.btnGraph;
}

/* === Modo oscuro === */
function toggleModo(){document.body.classList.toggle('dark');}

/* === Funcionalidad calculadora === */
function actualizarDisplay(){
  document.getElementById('display').textContent=valorActual;
  document.getElementById('operacionActual').textContent=(operacion&&primerNumero!==null)? `${primerNumero} ${operacion}`:'';
}
function agregarDigito(d){if(nuevoNumero){valorActual=(d==='.')?'0.':d;nuevoNumero=false;}else{if(d==='.'&&valorActual.includes('.'))return;valorActual+=d;}actualizarDisplay();}
function borrarDigito(){valorActual=(valorActual.length>1)?valorActual.slice(0,-1):'0';actualizarDisplay();}
function setOperacion(op){primerNumero=parseFloat(valorActual);operacion=op;nuevoNumero=true;actualizarDisplay();}
function limpiar(){valorActual='0';operacion=null;primerNumero=null;nuevoNumero=true;actualizarDisplay();}
function agregarHistorial(txt){historialArray.unshift(txt);if(historialArray.length>10)historialArray.pop();
  document.getElementById('historial').innerHTML=historialArray.map(i=>`<div class="historial-item">${i}</div>`).join('');}
function calcular(){
  if(primerNumero===null||operacion===null)return;
  let segundoNumero=parseFloat(valorActual), resultado;
  try{
    switch(operacion){
      case 'suma':resultado=primerNumero+segundoNumero;visualizarOperacion('suma',primerNumero,segundoNumero,resultado);break;
      case 'resta':resultado=primerNumero-segundoNumero;visualizarOperacion('resta',primerNumero,segundoNumero,resultado);break;
      case 'multiplicar':resultado=primerNumero*segundoNumero;visualizarOperacion('multiplicar',primerNumero,segundoNumero,resultado);break;
      case 'dividir':if(segundoNumero===0)throw new Error("No se puede dividir por cero");resultado=primerNumero/segundoNumero;visualizarOperacion('dividir',primerNumero,segundoNumero,resultado);break;
    }
    valorActual=resultado.toString();agregarHistorial(`${primerNumero} ${operacion} ${segundoNumero} = ${valorActual}`);
    primerNumero=null;operacion=null;nuevoNumero=true;actualizarDisplay();
  }catch(e){alert(e.message);limpiar();}
}

/* === Gráfica === */
function inicializarGrafica(){
  chart=new Chart(document.getElementById('grafica').getContext('2d'),{
    type:'line',
    data:{labels:[],datasets:[{label:'f(x)',data:[],borderColor:'rgb(102,126,234)',backgroundColor:'rgba(102,126,234,0.1)',tension:0.3,borderWidth:3,pointRadius:0}]},
    options:{responsive:true,maintainAspectRatio:false}
  });
}
function graficarFuncion(){
  let f=document.getElementById('funcionInput').value.trim();if(!f)return alert("Escribe una función");
  let x=[],y=[];for(let i=-10;i<=10;i+=0.1){try{y.push(math.evaluate(f,{x:i}));x.push(i);}catch(e){}}
  chart.data.labels=x;chart.data.datasets[0].data=y;chart.data.datasets[0].label=`f(x)=${f}`;chart.update();
}
function visualizarOperacion(tipo,a,b,res){
  let x=[],y=[],titulo='',colores={
    suma:{c:'rgb(17,153,142)',bg:'rgba(17,153,142,0.2)'},
    resta:{c:'rgb(240,147,251)',bg:'rgba(240,147,251,0.2)'},
    multiplicar:{c:'rgb(79,172,254)',bg:'rgba(79,172,254,0.2)'},
    dividir:{c:'rgb(250,112,154)',bg:'rgba(250,112,154,0.2)'}
  };
  if(tipo==='suma'){titulo=`${a}+${b}=${res}`;x=[0,1,2];y=[0,a,res];}
  if(tipo==='resta'){titulo=`${a}-${b}=${res}`;x=[0,1,2];y=[0,a,res];}
  if(tipo==='multiplicar'){titulo=`${a}×${b}=${res}`;for(let i=0;i<=1;i+=0.05){x.push(i);y.push(res*i);} }
  if(tipo==='dividir'){titulo=`${a}÷${b}=${res}`;for(let i=0;i<=1;i+=0.05){x.push(i);y.push(a-(a-res)*i);} }
  chart.data.labels=x;chart.data.datasets[0].data=y;chart.data.datasets[0].label=titulo;
  chart.data.datasets[0].borderColor=colores[tipo].c;chart.data.datasets[0].backgroundColor=colores[tipo].bg;chart.update();
}

/* === Test automático === */
function testOperaciones(){
  const pruebas=[{a:5,op:'s
